image: docker:27.3.1

services:
  - name: docker:27.3.1-dind

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

stages:
  - deploy

before_script:
  - apk add --no-cache bash curl jq python3 py3-pip
  # Install gcloud CLI
  - curl -sSL https://sdk.cloud.google.com | bash -s -- --disable-prompts --install-dir=/opt
  - export PATH="/opt/google-cloud-sdk/bin:$PATH"
  # Install kubectl and gke-gcloud-auth-plugin
  - curl -Lo /usr/local/bin/kubectl https://dl.k8s.io/release/v1.29.6/bin/linux/amd64/kubectl
  - chmod +x /usr/local/bin/kubectl
  - gcloud components install gke-gcloud-auth-plugin --quiet
  - export USE_GKE_GCLOUD_AUTH_PLUGIN=True
  # Authenticate with GCP
  - echo "$GCP_SERVICE_ACCOUNT_KEY" > /tmp/gcp-key.json
  - gcloud auth activate-service-account --key-file=/tmp/gcp-key.json
  - docker info

deploy:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - export PATH="/opt/google-cloud-sdk/bin:$PATH"
    - export USE_GKE_GCLOUD_AUTH_PLUGIN=True
    # Parse TF_OUTPUTS JSON
    - echo "$TF_OUTPUTS" > /tmp/tf.json
    - export GCP_PROJECT_ID=$(jq -r '.project_id.value' /tmp/tf.json)
    - export GCP_REGION=$(jq -r '.region.value' /tmp/tf.json)
    - export GKE_CLUSTER_NAME=$(jq -r '.gke_cluster_name.value' /tmp/tf.json)
    - export GKE_ZONE=$(jq -r '.gke_zone.value' /tmp/tf.json)
    - export DB_HOST=$(jq -r '.db_host.value' /tmp/tf.json)
    - export DB_NAME=$(jq -r '.db_name.value' /tmp/tf.json)
    - export DB_USERNAME=$(jq -r '.db_username.value' /tmp/tf.json)
    - export DB_PASSWORD=$(jq -r '.db_password.value' /tmp/tf.json)
    - export SECRET_KEY=$(jq -r '.secret_key.value' /tmp/tf.json)
    - export BACKEND_REGISTRY=$(jq -r '.backend_registry.value' /tmp/tf.json)
    - export FRONTEND_REGISTRY=$(jq -r '.frontend_registry.value' /tmp/tf.json)
    - export BUCKET_NAME=$(jq -r '.bucket_name.value' /tmp/tf.json)
    - gcloud config set project $GCP_PROJECT_ID
    # Create .env with API keys
    - |
      cat > .env << EOF
      GEMINI_API_KEY=${GEMINI_API_KEY}
      GROQ_API_KEY=${GROQ_API_KEY}
      TAVILY_API_KEY=${TAVILY_API_KEY}
      TINKER_API_KEY=${TINKER_API_KEY}
      EOF
    - chmod +x deploy-gcp.sh
    - bash deploy-gcp.sh
